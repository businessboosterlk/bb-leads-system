name: Daily Pipeline Summary Agent
on:
  # Decision 104, 7 Oct 2026: manual only. Replaced by the database function public.bb_leads_daily_summary(p_dry)
  # on pg_cron job bb-leads-summary-0830, 08:30 Colombo weekdays, which pushes one counts-only morning summary to
  # THULAIB and SHIARA (decision 104 repair, 7 Oct 2026: it sends no per-lead alerts).
  # SQL and undo: ~/bb-systems/leads-agents/
  workflow_dispatch:

jobs:
  pipeline-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Generate pipeline summary
        env:
          SUPABASE_URL: https://yyviiwnqgphyklcoijyd.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          LEADS=$(curl -s "${SUPABASE_URL}/rest/v1/pipeline?status=eq.active&select=id,stage,estimated_value" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}")

          TOTAL=$(echo "$LEADS" | jq length)
          NEW=$(echo "$LEADS" | jq '[.[] | select(.stage == "new_lead")] | length')
          CONTACTED=$(echo "$LEADS" | jq '[.[] | select(.stage == "contacted")] | length')
          DISCOVERY=$(echo "$LEADS" | jq '[.[] | select(.stage == "discovery")] | length')
          PROPOSAL=$(echo "$LEADS" | jq '[.[] | select(.stage == "proposal_sent")] | length')
          NEGOTIATION=$(echo "$LEADS" | jq '[.[] | select(.stage == "negotiation")] | length')

          MESSAGE="📊 Daily Pipeline Summary\n\nActive leads: ${TOTAL}\n• New Lead: ${NEW}\n• Contacted: ${CONTACTED}\n• Discovery: ${DISCOVERY}\n• Proposal Sent: ${PROPOSAL}\n• Negotiation: ${NEGOTIATION}"

          curl -s "${SUPABASE_URL}/rest/v1/agent_alerts" \
            -X POST \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"agent\":\"pipeline-summary\",\"system\":\"leads\",\"severity\":\"info\",\"message\":\"${MESSAGE}\"}"

          echo "Pipeline summary alert created"
